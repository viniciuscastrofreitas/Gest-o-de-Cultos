<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fundo do ícone nativo: elegante azul-marinho nobre -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Gradiente da prancheta/folha do relatório -->
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Gradiente da folha de papel do relatório -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Gradiente dourado/âmbar para detalhes da presilha e cruz -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Gradiente azul destaque das linhas do relatório -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Sombra suave para a folha -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Fundo do ícone com cantos arredondados padrão app nativo -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="4" opacity="0.5" />

  <!-- BASE DA PRANCHETA (Clipboard) -->
  <rect x="96" y="80" width="320" height="370" rx="32" fill="url(#boardGrad)" stroke="#475569" stroke-width="3" filter="url(#dropShadow)" />

  <!-- FOLHA DO RELATÓRIO DE CULTO -->
  <rect x="120" y="112" width="272" height="318" rx="20" fill="url(#paperGrad)" />

  <!-- LINHAS E ITENS DO RELATÓRIO -->
  <!-- Cabeçalho do relatório (Barra de título e tag de data) -->
  <rect x="150" y="152" width="130" height="14" rx="7" fill="url(#accentGrad)" />
  <rect x="294" y="152" width="68" height="14" rx="7" fill="#e2e8f0" />

  <!-- Divisor suave -->
  <line x1="150" y1="184" x2="362" y2="184" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />

  <!-- Item 1: Linha de louvores / hinos (com ícone de check) -->
  <circle cx="162" cy="214" r="8" fill="#10b981" />
  <path d="M 158 214 L 161 217 L 167 211" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="182" y="208" width="180" height="12" rx="6" fill="#475569" />

  <!-- Item 2: Linha de obreiros / palavra -->
  <circle cx="162" cy="254" r="8" fill="#10b981" />
  <path d="M 158 254 L 161 257 L 167 251" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="182" y="248" width="140" height="12" rx="6" fill="#64748b" />

  <!-- Item 3: Linha de frequência / comunhão -->
  <circle cx="162" cy="294" r="8" fill="#10b981" />
  <path d="M 158 294 L 161 297 L 167 291" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="182" y="288" width="160" height="12" rx="6" fill="#64748b" />

  <!-- Bloco inferior de estatística / notas do culto -->
  <rect x="150" y="332" width="212" height="66" rx="14" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2" />
  <!-- Gráfico de barras simplificado no rodapé do relatório -->
  <rect x="174" y="370" width="16" height="16" rx="4" fill="#818cf8" />
  <rect x="202" y="356" width="16" height="30" rx="4" fill="#6366f1" />
  <rect x="230" y="348" width="16" height="38" rx="4" fill="#4f46e5" />
  <!-- Linhas descritivas ao lado das barras -->
  <rect x="264" y="356" width="76" height="8" rx="4" fill="#94a3b8" />
  <rect x="264" y="372" width="54" height="8" rx="4" fill="#cbd5e1" />

  <!-- PRESILHA METÁLICA SUPERIOR DA PRANCHETA (Clip) -->
  <g transform="translate(196, 62)">
    <!-- Base da presilha -->
    <rect x="0" y="10" width="120" height="38" rx="10" fill="url(#goldGrad)" filter="url(#dropShadow)" />
    <!-- Abertura/furo para pendurar a prancheta -->
    <circle cx="60" cy="24" r="8" fill="#1e293b" />
    <circle cx="60" cy="24" r="5" fill="none" stroke="#fbbf24" stroke-width="2" />
  </g>

  <!-- TEXTO IDENTIFICADOR DISCRETO NA BASE DO ÍCONE -->
  <text x="256" y="482" text-anchor="middle" fill="#94a3b8" font-family="'Outfit', system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" letter-spacing="4">RELATÓRIO DE CULTO</text>
</svg>
